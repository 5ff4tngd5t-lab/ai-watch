name: weekly-ai-watch

on:
  schedule:
    # 每周一 12:23 北京时间（04:23 UTC）
    - cron: '23 4 * * 1'
  workflow_dispatch: {}

permissions:
  contents: write

concurrency:
  group: weekly-ai-watch
  cancel-in-progress: false

jobs:
  monitor:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'

      - name: Install dependencies
        run: pip install -r requirements.txt

      - name: Run monitor
        env:
          LLM_API_KEY: ${{ secrets.LLM_API_KEY }}
          LLM_BASE_URL: ${{ secrets.LLM_BASE_URL }}
          LLM_MODEL: ${{ secrets.LLM_MODEL }}
          PUSH_WEBHOOK: ${{ secrets.PUSH_WEBHOOK }}
        run: python monitor.py

      - name: Commit digest and state
        run: |
          git config user.name "ai-watch-bot"
          git config user.email "ai-watch-bot@users.noreply.github.com"
          git add digest/ state/
          git commit -m "Weekly digest $(date +%F)" || echo "No changes to commit"
          git push
